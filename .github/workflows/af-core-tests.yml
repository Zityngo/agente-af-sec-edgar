name: AF core - pruebas
on:
  pull_request:
    paths: ['af_core/**', 'tests/**', 'app/**', 'scripts/build_demo_db.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -v
