name: AF A - Historical SEC 20 issuer backtest input
on:
  workflow_dispatch:
  push:
    branches: [agent/chatgpt-a]
    paths:
      - 'scripts/sec_backtest20_snapshot.py'
      - '.github/workflows/af-backtest20-snapshot.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historical SEC as-filed public data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/sec_backtest20_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: af-public-backtest20-xbrl-snapshot
          path: publico/af_backtest20/sec_20_companyfacts_asfiled.json
          retention-days: 20
