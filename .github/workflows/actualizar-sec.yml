name: SEC EDGAR - seguimiento diario
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/actualizar-sec.yml', 'scripts/qa_sec_daily_batch.py', 'scripts/test_qa_sec_daily_batch.py']

permissions:
  contents: read

concurrency:
  group: sec-edgar-piloto
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar SEC EDGAR oficial
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python descargar_sec.py
      - name: Descargar lote S&P 500
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python descargar_sp500.py
      - name: Tests sin llamadas al exterior - integridad SEC
        run: python -m unittest discover -s scripts -p 'test_qa_sec_daily_batch.py' -v
      - name: Validar lote SEC y detectar 10-K 10-Q 8-K nuevos
        run: python scripts/qa_sec_daily_batch.py
      - name: Conservar resultados para validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-edgar-piloto
          path: publico/sec/
          retention-days: 90
          if-no-files-found: error
