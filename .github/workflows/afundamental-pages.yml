name: Publicar A.Fundamental 2.0 (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/afundamental-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: afundamental-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar dashboard 2.2 y cobertura histórica
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          html=Path('docs/index.html').read_text(encoding='utf-8')
          assert 'A.Fundamental 2.2' in html
          for field in ('companySelect','sameQuarterSelect','sameQuarterMetric','peerChart','valuationTable'):
              assert ('id="'+field+'"') in html, field
          match=re.search(r'<script>const DATA = (\\{[^\\n]+\\});',html)
          if not match:
              raise SystemExit('Dashboard DATA no encontrado')
          data=json.loads(match.group(1))
          assert data['ticker']=='MSFT'
          assert len(data['annual']['MSFT'])==5
          assert len(data['quarterly']['MSFT'])>=20
          assert all(t in data['annual'] and t in data['quarterly'] for t in ('MSFT','ORCL','GOOGL','AMZN','CRM'))
          assert abs(data['summary']['revenue_2026']-331.839)<0.001
          print('A.Fundamental 2.2: anual, trimestres, pares y controles OK')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
