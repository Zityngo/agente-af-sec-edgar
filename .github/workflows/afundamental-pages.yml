name: Publicar A.Fundamental 2.3 (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/afundamental-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: afundamental-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar dashboard completo 2.3 y controles SEC
        run: |
          node --check docs/data.js
          node --check docs/app.js
          node --check docs/upgrade.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm')
          const ctx={window:{}}
          vm.runInNewContext(fs.readFileSync('docs/data.js','utf8'),ctx)
          const data=ctx.window.AF_DATA
          if(!data||!data.AF23)throw Error('Falta expediente v2.3')
          const x=data.AF23
          if(data.history.length!==5)throw Error('Historial MSFT 2.1 perdido')
          if(Math.abs(data.dcf.cases.base.value-390.7)>1)throw Error('DCF 2.1 no conservado')
          for(const t of ['MSFT','ORCL','GOOGL','AMZN','CRM']){
            if(x.annual[t].length!==5)throw Error('Anual incompleto: '+t)
            if(x.quarterly[t].length<20)throw Error('Trimestral incompleto: '+t)
          }
          const q=x.quarterly.MSFT
          const q4=q.find(r=>r.fy===2026&&r.q==='Q4')
          if(Math.abs(q4.fcf-19.639)>0.01)throw Error('FCF Q4 FY2026 incoherente')
          const html=fs.readFileSync('docs/index.html','utf8')
          for(const id of ['negocio','crecimiento','retornos','caja','balance','comparables','valoracion','preguntas','glosario','fuentes','tablas','evolucion-comparables','af23-table','af23-compare-result']){
            if(!html.includes('id="'+id+'"'))throw Error('Apartado o control perdido: '+id)
          }
          for(const f of ['docs/upgrade.css','docs/upgrade.js','docs/styles.css','docs/app.js']){
            if(!fs.existsSync(f))throw Error('Recurso ausente: '+f)
          }
          if(!fs.readFileSync('docs/app.js','utf8').includes('1uXRFicl0oCIEEyiQ8H7oG4GCswe1uiJh'))throw Error('PDF premium no enlazado')
          console.log('A.Fundamental 2.3: legado 2.1, DCF, fuentes SEC y nuevas tablas OK')
          JS
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
