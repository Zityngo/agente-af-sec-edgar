name: SEC - comprobar staging sin credenciales

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sec_auto_staging.py'
      - 'scripts/sec_quarterly_cashflow.py'
      - 'scripts/test_sec_auto_staging.py'
      - '.github/workflows/actualizar-sec.yml'
      - '.github/workflows/sec-staging-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis
        run: python -m py_compile scripts/sec_auto_staging.py
      - name: Ejecutar pruebas de identidad y periodos
        run: python -m unittest discover -s scripts -p 'test_sec_auto_staging.py' -v
