name: AF A - piloto SEC EODHD Apple Tesla Amazon
on:
  workflow_dispatch:
  push:
    branches: ['agent/chatgpt-a']
    paths:
      - '.github/workflows/af-pilot3-sec-eodhd.yml'
      - 'af_core/**'
      - 'tests/**'
      - 'scripts/pilot_3_sec_eodhd.py'
      - 'scripts/pilot_5.py'
      - 'scripts/normalize_sp500_v2.py'
      - 'scripts/build_jons_review.py'
      - 'data/pilot_price_reference_2026-10-20.json'
      - 'app/jon_review_template.html'
permissions:
  contents: read
concurrency:
  group: af-a-pilot3-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas del motor existente y de la nueva verificación
        run: python -m unittest discover -s tests -v
      - name: SEC + EODHD demo (tres empresas, solo lectura)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/pilot_3_sec_eodhd.py --out publico/pilot3
      - name: Construir informe piloto para revisión de Jon (HTML, PDF, JSON)
        run: |
          python -m pip install reportlab==4.2.5 pypdf
          python scripts/build_jons_review.py --db publico/pilot3/pilot.db --audit publico/pilot3/auditoria_piloto_3.json --out publico/pilot3/revision_jon
          python -c "from pypdf import PdfReader; from pathlib import Path; p=Path('publico/pilot3/revision_jon/jon_review.pdf'); r=PdfReader(str(p)); assert len(r.pages)>=4; assert 'A.FUNDAMENTAL' in (r.pages[0].extract_text() or '')"
      - name: Guardar informe y auditoría sin dump del proveedor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: af-a-pilot3-sec-eodhd
          path: |
            publico/pilot3/analisis_piloto_3.md
            publico/pilot3/auditoria_piloto_3.json
            publico/pilot3/pilot.db
            publico/pilot3/revision_jon/jon_review.html
            publico/pilot3/revision_jon/jon_review.pdf
            publico/pilot3/revision_jon/jon_review.json
          retention-days: 30
          if-no-files-found: warn
